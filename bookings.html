<body>

    <!--Navigation-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">

            <!-- Brand / Logo-->

        </div>

    <!--Book Appointment Section-->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="text-center mb-4">Book Your Appointment</h1>
                <form id="bookingForm" class="card p-4 shadow-sm needs-validation" novalidate>

                    <!--Full name-->
                    <div class="mb-3">
                        <label class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" required>
                    </div>

                    <!--Hairstyle Preference / Service-->
                    <div class="mb-3">
                        <label class="form-label">Hairstyle Preference / Service <span class="text-danger">*</span></label>
                        <select class="form-select" required>
                            <option value="">Choose a service...</option>
                            <option>Braids - P320</option>
                            <option>Knotless Braids - P350</option>
                            <option>Cornrows - P250</option>
                            <option>Natural Hair - P320</option>
                            <option>Kids Styles - P180</option>
                        </select>
                    </div>

                    <!--Phone Number and Preferred Date-->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone Number <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" placeholder="+267" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Preferred Date <span class="text-danger">*</span></label>
                            <input type="date" id="appointment-date" class="form-control" required>
                        </div>
                    </div>

                    <!--Preferred Time-->
                    <div class="mb-3">
                        <label class="form-label">Preferred Time <span class="text-danger">*</span></label>
                        <input type="time" class="form-control" required>
                    </div>

                    <!--Comments-->
                    <div class="mb-3">
                        <label class="form-label">Additional Comments</label>
                        <textarea class="form-control" rows="3"></textarea>
                    </div>

                    <!--Submit Button-->
                    <button type="submit" class="btn w-100">Submit Booking Request</button>
                </form>
            </div>
        </div>
    </div>

    <!--Footer-->
    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="row text-center align-items-center">
                <div class="col-md-4 mb-3 mb-md-0 text-md-start">
                    <h5>Kutlo's Hairdo</h5>
                    <p>Main Mall, Gaborone, Botswana<br>Creative styling since 2024</p>
                </div>

                <div class="col-md-4 mb-3 mb-md-0 text-center small">
                © 2026 Kutlo's Hairdo Bookings. All Rights Reserved.
                </div>

                <div class="col-md-4 text-md-end">
                    <h5>Contact Us</h5>
                    <p>+267 71 234 567<br>hello@kutloshairdo.co.bw</p>
                </div>
            </div>
        </div>
    </footer>

    <!--Bootstrap and JavaScript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
